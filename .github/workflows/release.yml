name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@cross
        if: runner.os == 'Linux'
      - name: build
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            *musl) cross build --release --target ${{ matrix.target }} ;;
            *) cargo build --release --target ${{ matrix.target }} ;;
          esac
      - name: package
        shell: bash
        run: |
          cd "target/${{ matrix.target }}/release"
          if [ -f rustidian.exe ]; then
            tar czf "rustidian-${{ matrix.target }}.tar.gz" rustidian.exe
          else
            tar czf "rustidian-${{ matrix.target }}.tar.gz" rustidian
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: rustidian-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/rustidian-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  publish-crate:
    needs: build
    runs-on: ubuntu-latest
    env:
      CRATES_TOKEN: ${{ secrets.CRATES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --token "$CRATES_TOKEN"
        if: env.CRATES_TOKEN != ''

  update-tap:
    needs: release
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
    steps:
      - name: generate and push formula
        if: env.TAP_TOKEN != ''
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -e
          version="${VERSION#v}"
          base="https://github.com/lurexh/rustidian/releases/download/${VERSION}"
          dl() { curl -fsSL "$base/rustidian-$1.tar.gz" | sha256sum | cut -d' ' -f1; }
          s_linux=$(dl x86_64-unknown-linux-musl)
          s_linux_arm=$(dl aarch64-unknown-linux-musl)
          s_mac=$(dl x86_64-apple-darwin)
          s_mac_arm=$(dl aarch64-apple-darwin)
          cat > Formula.rb <<EOF
          class Rustidian < Formula
            desc "Obsidian vault MCP server — single Rust binary, no Obsidian app needed"
            homepage "https://github.com/lurexh/rustidian"
            version "$version"

            if OS.mac? && Hardware::CPU.arm?
              url "$base/rustidian-aarch64-apple-darwin.tar.gz"
              sha256 "$s_mac_arm"
            elsif OS.mac?
              url "$base/rustidian-x86_64-apple-darwin.tar.gz"
              sha256 "$s_mac"
            elsif OS.linux? && Hardware::CPU.arm? && Hardware::CPU.is_64_bit?
              url "$base/rustidian-aarch64-unknown-linux-musl.tar.gz"
              sha256 "$s_linux_arm"
            else
              url "$base/rustidian-x86_64-unknown-linux-musl.tar.gz"
              sha256 "$s_linux"
            end

            def install
              bin.install "rustidian"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/rustidian --version 2>&1 || true")
            end
          end
          EOF
          git clone -q "https://x-access-token:${TAP_TOKEN}@github.com/lurexh/homebrew-tap.git" tap
          mkdir -p tap/Formula
          mv Formula.rb tap/Formula/rustidian.rb
          cd tap
          git config user.name "release-bot"
          git config user.email "bot@users.noreply.github.com"
          git add Formula/rustidian.rb
          git commit -m "rustidian $version" || exit 0
          git push -q origin main
          echo "tap updated"
